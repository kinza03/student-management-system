services:
  - type: web
    name: student-management-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        fromDatabase:
          name: student-management-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: student-management-db
    plan: free
